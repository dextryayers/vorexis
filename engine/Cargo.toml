[package]
name = "aipentest-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
ego-tree = "0.11"
futures = "0.3.33"
hickory-resolver = "0.26.1"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "http2", "gzip", "brotli", "deflate", "stream"] }
rustls = "0.23.43"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.4"
url = "2.5.8"
webpki-roots = "1.0.9"
x509-parser = "0.18.1"
